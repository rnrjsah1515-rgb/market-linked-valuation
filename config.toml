# ─────────────────────────────────────────────────────────────
# 밸류에이션 설정 파일
# - [company], [valuation] 등은 가정(assumption)입니다. 값을 바꾸면 결과가 바뀝니다.
# - "근거:" 주석이 달린 항목은 보고서에 출처를 함께 적어야 하는 값입니다.
# ─────────────────────────────────────────────────────────────

[company]
name = "대한항공"
stock_code = "003490"          # 6자리 종목코드 (DART 고유번호는 자동 조회)
fs_div = "CFS"                 # CFS = 연결, OFS = 별도
history_years = [2021, 2022, 2023, 2024]
valuation_date = "2025-03-31"  # 2024 사업보고서 공시 직후. 기준연도(2024)와 같은 실체를 시장가격과 비교한다
# 기준연도 이후 최신 재무상태표로 순차입금을 갱신합니다. 쓰지 않으려면 이 줄을 지우세요.
# report_code: 11012 반기 / 11013 1분기 / 11014 3분기
# 2025-03-31 평가 시점에는 2024 사업보고서(연말)가 가장 최신이므로 사용하지 않습니다.

[market_data]
oil_benchmark = "010102"       # ECOS 902Y003 품목: 010101 WTI / 010102 Dubai / 010103 Brent
oil_lookback_months = 12       # 기준 유가 = 최근 N개월 평균 (선물 커브 연동 전 임시 가정)
vol_lookback_months = 120      # 유가·환율 변동성·상관계수 추정 기간
beta_lookback_weeks = 104      # 베타 회귀분석 기간 (주간 수익률)
# 베타 추정에 쓸 시장지수: "KOSPI" 또는 "KOSPI_EX_SEMIS"
# 근거: 평가기준일 현재 반도체 3종목이 KOSPI 시가총액의 큰 비중을 차지해 KOSPI 베타가 왜곡됩니다.
market_index = "KOSPI_EX_SEMIS"

[wacc]
equity_risk_premium = 0.07     # 근거: 예시값입니다. 사용 시 출처(시장위험프리미엄 조사 등)를 기재하세요.
size_premium = 0.0
credit_spread_over_aa = 0.01   # 근거: 대상 기업 신용등급과 AA- 회사채의 금리 차이를 입력하세요.
tax_rate = 0.264               # 근거: 법인세 최고세율 + 지방소득세. 평가 시점 현행 세율을 확인하세요.
beta_override = 0.0            # 0이면 시장지수 대비 회귀분석 베타 사용
# 채택 할인율. 0이면 위 CAPM 계산값(회귀 베타 기반)을 씁니다.
# 근거: 대한항공 2024 사업보고서 주석 46 — 아시아나항공 고객관련무형자산 평가에 사용한 가중평균자본비용 8.4%.
# 주가회귀 베타는 설명력(R²)이 낮아 할인율을 정확히 추정하기 어렵다고 보고, 회사가 공시한 값을 채택합니다.
wacc_override = 0.084
target_debt_to_equity = 0.0    # 0이면 현재 시장가치 기준 D/E 사용

[forecast]
years = 5
revenue_growth = [0.04, 0.035, 0.03, 0.03, 0.025]   # 물량(capacity) 성장률 가정
terminal_growth = 0.02
mid_year_convention = true
ratio_years = 1                # 비율 가정에 쓰는 최근 과거 연도 수
# 2024년만 사용합니다. pro forma 손익과 재무상태표(아시아나 포함)의 범위가 일치하는 유일한 해이고,
# 2022~2023년 화물 호황 마진은 시장이 더 이상 가정하지 않는 것으로 보이기 때문입니다(역산 결과 참조).
# 아래 비율은 비워 두면(0) 과거 평균을 사용합니다.
da_to_revenue = 0.0
capex_to_revenue = 0.0
nwc_to_revenue = 0.0
capex_floor_to_da = 1.0        # 예측기간 CAPEX 하한 = 감가상각비 × 이 값 (아래 설명)
terminal_capex_to_da = 1.0     # 영구기간 CAPEX / 감가상각비
# 감가상각비에는 사용권자산(리스) 상각이 포함되지만, 신규 리스 취득은 현금흐름표 CAPEX 에 잡히지 않습니다.
# 리스부채를 순차입금에 넣는 구조에서 CAPEX 를 과소 추정하지 않도록 감가상각비 수준을 하한으로 둡니다.

[exposure]
# 근거: 사업보고서 '시장위험' 주석과 영업비용 주석을 보고 입력하세요.
usd_revenue_share = 0.0        # 매출 중 달러 연동 비중
usd_nonfuel_cost_share = 0.0   # 유류비 외 현금영업비용 중 달러 연동 비중
fuel_pass_through = 0.5        # 근거: 예시값입니다. 유가 변동분 중 유류할증료·운임으로 매출에 전가되는 비율(0~1)
# F 경로: 달러 순부채의 원화 환산 효과. 환율이 오르면 순차입금이 늘어 주주가치가 줄어듭니다.
# 근거: 2024 사업보고서 'II. 사업의 내용 > 시장위험' — 순외화부채 약 35억불 (2025말 55억불, 2026 반기 56억불)
usd_net_debt = 3_500_000_000   # 달러 단위. 0이면 이 경로를 계산하지 않습니다.

# 유류비는 DART 재무제표 API에 없으므로 사업보고서 영업비용 주석에서 직접 입력합니다. (단위: 억원)
# 예) 2024 = 12345.0
# 근거: 각 연도 사업보고서 주석 '비용의 성격별 분류' 연결 연료유류비 (백만원 → 억원)
[overrides.fuel_cost]
2019 = 31716.44
2020 = 12382.34
2021 = 17860.81
2022 = 41362.38
2023 = 48023.39
2024 = 49808.48
2025 = 67419.62

# 감가상각비(사용권자산 포함)가 API에서 자동 추출되지 않을 때만 입력합니다. (단위: 억원)
[overrides.depreciation]

# 발행주식수: 0이면 주식시세 API 의 상장주식수(보통주)를 사용합니다.
[overrides.shares]
shares_outstanding = 0

[scenario]
oil_shocks = [-0.3, -0.15, 0.0, 0.15, 0.3]     # 유가 민감도 (기준 대비)
fx_shocks = [-0.1, -0.05, 0.0, 0.05, 0.1]      # 환율 민감도 (기준 대비)
wacc_steps = [-0.01, -0.005, 0.0, 0.005, 0.01]
growth_steps = [-0.005, -0.0025, 0.0, 0.0025, 0.005]
exit_ev_ebitda = [5.0, 6.0, 7.0]               # 근거: 비교기업 EV/EBITDA 배수 범위를 입력하세요.

[simulation]
paths = 5000
seed = 42
hedge_ratios = [0.0, 0.25, 0.5, 0.75]          # 향후 1~2년 유류 물량 중 선물로 고정하는 비율
hedge_years = 2

# ─────────────────────────────────────────────────────────────
# Pro forma 조정 (아시아나항공 합산)
# 대한항공은 2024년 12월 31일을 인수의제일로 아시아나를 연결했습니다. 그래서 2024년 연결
# 재무상태표에는 아시아나가 전액 들어 있지만 손익계산서에는 들어 있지 않습니다.
# 순차입금(합병 후)과 이익(합병 전)의 범위를 맞추기 위해, 손익·투자 항목에 아시아나 연결
# 실적을 더합니다. 재무상태표 항목은 이미 합산돼 있으므로 건드리지 않습니다.
#
# 근거: 아시아나항공(020560) 각 연도 사업보고서 연결재무제표 및 영업비용 주석
#       대한항공 2024 사업보고서 주석 46 — "사업결합이 기초에 발생하였다고 가정할 경우
#       결합기업의 수익 26,189,286백만원" (= 261,893억원)으로 2024년 매출을 대사합니다.
# 한계: 두 회사 간 내부거래(코드셰어 등)를 공개 자료로 제거할 수 없어 매출·비용이 소폭 과대될 수 있습니다.
[proforma]
check_revenue = { year = 2024, amount = 261892.86 }   # 공시 pro forma 매출과 대사

[proforma.2022]
revenue = 62067.0
operating_income = 5988.0
depreciation = 9898.65
capex = 4008.0
fuel_cost = 20701.35

[proforma.2023]
revenue = 76233.0
operating_income = 6199.0
depreciation = 10045.49
capex = 6088.0
fuel_cost = 24292.33

[proforma.2024]
revenue = 83186.0
